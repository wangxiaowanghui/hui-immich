name: Publish Hui Immich Images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable image tag, for example v3.1.0-hui.1
        required: true
        type: string
  push:
    tags:
      - 'v*-hui.*'

permissions: {}

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      commit_tag: ${{ steps.tag.outputs.commit_tag }}
    steps:
      - name: Validate immutable release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "${EVENT_NAME}" == "push" ]]; then
            RELEASE_TAG="${REF_NAME}"
          else
            RELEASE_TAG="${RELEASE_TAG_INPUT}"
          fi

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-hui\.[0-9]+$ ]]; then
            echo "release_tag must match v<major>.<minor>.<patch>-hui.<revision>" >&2
            exit 1
          fi

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "commit_tag=commit-${SHA}" >> "${GITHUB_OUTPUT}"

  server:
    needs: release-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          build-args: DEVICE=cpu
          platforms: linux/amd64
          push: true
          provenance: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hui-immich-server:${{ needs.release-metadata.outputs.release_tag }}
            ghcr.io/${{ github.repository_owner }}/hui-immich-server:${{ needs.release-metadata.outputs.commit_tag }}

  machine-learning:
    needs: release-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish CPU machine-learning image
        uses: docker/build-push-action@v6
        with:
          context: machine-learning
          file: machine-learning/Dockerfile
          build-args: DEVICE=cpu
          platforms: linux/amd64
          push: true
          provenance: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hui-immich-machine-learning:${{ needs.release-metadata.outputs.release_tag }}
            ghcr.io/${{ github.repository_owner }}/hui-immich-machine-learning:${{ needs.release-metadata.outputs.commit_tag }}

  make-packages-public:
    needs: [server, machine-learning]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Publish packages for anonymous NAS pulls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for package in hui-immich-server hui-immich-machine-learning; do
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${package}/visibility" \
              -f visibility=public
          done
